name: Release

# Runs by itself when a push to main changes the version in the workspace
# Cargo.toml ([workspace.package] version), that is when the
# `chore(release): vX.Y.Z` bump PR is merged: if the tag vX.Y.Z does not
# exist yet, it publishes that version. A version with a suffix
# (0.11.0-beta.1) becomes a pre-release. Pushes that leave the version alone,
# or whose tag already exists, publish nothing.
#
# It can also be started by hand (workflow_dispatch) with the version to
# publish (e.g. 0.2.0), for a dry run or to retry a failed release. The
# version must already be set in the workspace Cargo.toml.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run: verify and build everything, publish nothing (the files stay as workflow artifacts)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what to publish: the inputs when started by hand, the version in
  # Cargo.toml on a push (skipped when its tag already exists).
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            prerelease="$INPUT_PRERELEASE"
            dry_run="$INPUT_DRY_RUN"
            publish=true
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
            case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
            dry_run=false
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              publish=false
              echo "::notice::v$version is already released: nothing to publish"
            else
              publish=true
              echo "::notice::Cargo.toml is at $version and v$version does not exist yet: publishing it"
            fi
          fi
          {
            echo "version=$version"
            echo "prerelease=${prerelease:-false}"
            echo "dry_run=${dry_run:-false}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify version and tests
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer version (expected X.Y.Z)"
            exit 1
          fi

      - name: Check the version matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml has version $cargo_version, but the release asks for $VERSION. Merge a version bump first."
            exit 1
          fi

      - name: Check the npm package has the same version
        run: |
          npm_version=$(node -p "require('./packages/fratmscript/package.json').version")
          if [ "$npm_version" != "$VERSION" ]; then
            echo "::error::packages/fratmscript/package.json has version $npm_version, but the release asks for $VERSION"
            exit 1
          fi

      - name: Check create-fratm has the same version
        run: |
          create_version=$(node -p "require('./packages/create-fratm/package.json').version")
          create_dep=$(node -p "require('./packages/create-fratm/package.json').dependencies.fratmscript")
          if [ "$create_version" != "$VERSION" ]; then
            echo "::error::packages/create-fratm/package.json has version $create_version, but the release asks for $VERSION"
            exit 1
          fi
          if [ "$create_dep" != "^$VERSION" ]; then
            echo "::error::packages/create-fratm depends on fratmscript $create_dep, not ^$VERSION"
            exit 1
          fi

      - name: Check the agent plugin has the same version
        run: |
          plugin_version=$(node -p "require('./packages/agent-plugin/.claude-plugin/plugin.json').version")
          if [ "$plugin_version" != "$VERSION" ]; then
            echo "::error::packages/agent-plugin/.claude-plugin/plugin.json has version $plugin_version, but the release asks for $VERSION"
            exit 1
          fi

      - name: Check the VS Code extension has the same version
        run: |
          ext_version=$(node -p "require('./packages/vscode-extension/package.json').version")
          if [ "$ext_version" != "$VERSION" ]; then
            echo "::error::packages/vscode-extension/package.json has version $ext_version, but the release asks for $VERSION"
            exit 1
          fi

      - name: Check the tag does not exist yet
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --locked

  build-cli:
    name: Build fratm (${{ matrix.target }})
    needs: [plan, verify]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p fratm-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="fratm-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/fratm" README.md "$name/"
          tar -czf "$name.tar.gz" "$name"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "fratm-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fratm.exe", "README.md" -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: fratm-${{ env.TAG }}-${{ matrix.target }}.*
          if-no-files-found: error

  build-wasm:
    name: Build WASM package
    needs: [plan, verify]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build
        run: |
          wasm-pack build crates/fratm-wasm --release --target web --out-dir "$GITHUB_WORKSPACE/fratm-wasm-$TAG"
          tar -czf "fratm-wasm-$TAG.tar.gz" "fratm-wasm-$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: fratm-wasm-${{ env.TAG }}.tar.gz
          if-no-files-found: error

  build-vscode:
    name: Build the VS Code extension
    needs: [plan, verify]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build, test and package
        run: |
          # The npm package also goes into the release, next to the one on npm
          (cd packages/fratmscript && npm run build && npm test && npm pack --pack-destination "$GITHUB_WORKSPACE")
          cd packages/vscode-extension
          pnpm install --frozen-lockfile
          pnpm compile
          pnpm test
          pnpm exec vsce package --no-dependencies --out "$GITHUB_WORKSPACE/fratmscript-vscode-$TAG.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: fratmscript-vscode-${{ env.TAG }}.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: fratmscript-*.tgz
          if-no-files-found: error

  publish:
    name: Tag and publish the release
    needs: [plan, build-cli, build-wasm, build-vscode]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${flags[@]}"

  publish-npm:
    name: Publish the npm packages
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without an npm token
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, so the fratmscript npm package was not published"

      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''

      - uses: dtolnay/rust-toolchain@stable
        if: env.NODE_AUTH_TOKEN != ''
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: env.NODE_AUTH_TOKEN != ''
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build, test and publish
        if: env.NODE_AUTH_TOKEN != ''
        env:
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          cd packages/fratmscript
          npm run build
          npm test
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          npm publish --provenance --access public --tag "$tag"
          # create-fratm depends on the version just published
          cd ../create-fratm
          npm publish --provenance --access public --tag "$tag"

  publish-vscode:
    name: Publish the VS Code extension
    needs: [plan, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish to the VS Code Marketplace
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set, so the extension was not published to the VS Code Marketplace"
          else
            npx --yes @vscode/vsce@3 publish --packagePath "fratmscript-vscode-$TAG.vsix"
          fi

      - name: Publish to Open VSX
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set, so the extension was not published to Open VSX"
          else
            # The first publish needs the namespace; later runs find it there
            npx --yes ovsx@0 create-namespace fratmscript -p "$OVSX_PAT" || true
            npx --yes ovsx@0 publish "fratmscript-vscode-$TAG.vsix" -p "$OVSX_PAT"
          fi

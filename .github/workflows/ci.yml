name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Compile examples
        run: |
          cargo build -p fratm-cli --locked
          for f in examples/*.fratm; do
            ./target/debug/fratm build "$f"
          done
          ./target/debug/fratm check examples/*.fratm
          ./target/debug/fratm fmt --check examples/*.fratm

      - name: Check the playground tour lessons
        run: |
          cd packages/playground/src/scola
          ../../../../target/debug/fratm check *.fratm
          ../../../../target/debug/fratm fmt --check *.fratm
          for solution in *.soluzione.fratm; do
            lesson="${solution%.soluzione.fratm}"
            # The solution prints exactly the expected output, the starter does not
            diff -u "$lesson.out" <(../../../../target/debug/fratm lancia "$solution")
            if diff -q "$lesson.out" <(../../../../target/debug/fratm lancia "$lesson.fratm") > /dev/null; then
              echo "::error file=packages/playground/src/scola/$lesson.fratm::the starter already prints the expected output"
              exit 1
            fi
          done

      - name: Check the playground guide
        run: |
          cd packages/playground/src/guida
          # guida.json: unique ids, text in every UI language, every snippet listed and present
          node -e '
            const fs = require("fs")
            const { sections } = JSON.parse(fs.readFileSync("guida.json", "utf8"))
            const ids = new Set()
            const listed = new Set()
            for (const section of sections) {
              if (ids.has(section.id)) throw new Error(`duplicate section id: ${section.id}`)
              ids.add(section.id)
              for (const lang of ["it", "en", "nap"]) {
                if (!section.title?.[lang] || !section.body?.[lang]?.length) throw new Error(`section ${section.id} has no ${lang} text`)
              }
              for (const file of section.snippets) {
                if (!fs.existsSync(file)) throw new Error(`section ${section.id} names a missing snippet: ${file}`)
                listed.add(file)
              }
            }
            for (const file of fs.readdirSync(".").filter(f => f.endsWith(".fratm"))) {
              if (!listed.has(file)) throw new Error(`${file} is not in guida.json`)
            }
          '
          fratm=../../../../target/debug/fratm
          for snippet in *.fratm; do
            case "$snippet" in
              *.sbagliato.fratm)
                # Snippets that show a compiler message must keep failing
                if "$fratm" check "$snippet" > /dev/null 2>&1; then
                  echo "::error file=packages/playground/src/guida/$snippet::this snippet should not compile"
                  exit 1
                fi
                ;;
              *)
                "$fratm" check "$snippet"
                "$fratm" fmt --check "$snippet"
                diff -u "${snippet%.fratm}.out" <("$fratm" lancia "$snippet")
                ;;
            esac
          done

  npm-package:
    name: npm package and VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and test
        run: |
          cd packages/fratmscript
          npm run build
          npm test
          npm pack --dry-run

      - name: Build the projects made with fratm nuovo
        run: |
          cd packages/fratmscript
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$GITHUB_WORKSPACE"
          cargo run -q -p fratm-cli --locked -- nuovo "$RUNNER_TEMP/pizzeria"
          cargo run -q -p fratm-cli --locked -- nuovo --senza-react "$RUNNER_TEMP/friggitoria"
          # The local package, not the published one: the templates must work with this commit
          cd "$RUNNER_TEMP/pizzeria"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/fratmscript-*.tgz
          npm run build
          grep -q "Pizze ordinate" dist/assets/*.js
          cd "$RUNNER_TEMP/friggitoria"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/fratmscript-*.tgz
          npm run build
          grep -q "Pizze sfurnate" dist/assets/*.js

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build, test and package the VS Code extension
        run: |
          cd packages/vscode-extension
          pnpm install --frozen-lockfile
          pnpm compile
          pnpm test
          pnpm package

  playground:
    name: Playground build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd crates/fratm-wasm
          wasm-pack build --target web --out-dir ../../packages/playground/public/pkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          cd packages/playground
          pnpm install --frozen-lockfile

      - name: Build playground
        run: |
          cd packages/playground
          pnpm build

      - name: Check the WASM compiler is bundled
        run: test -f packages/playground/dist/pkg/fratm_wasm_bg.wasm

  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install from the latest release (sh)
        if: runner.os != 'Windows'
        env:
          FRATM_INSTALL_DIR: ${{ runner.temp }}/fratm-bin
        run: |
          sh install.sh
          "$FRATM_INSTALL_DIR/fratm" --version

      - name: Install from the latest release (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FRATM_INSTALL_DIR: ${{ runner.temp }}\fratm-bin
          GH_TOKEN: ${{ github.token }}
        run: |
          ./install.ps1
          & "$env:FRATM_INSTALL_DIR\fratm.exe" --version
